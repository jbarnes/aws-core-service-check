[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-core-service-check"
version = "1.0.0"
description = "Pre-check AWS organization accounts for Control Tower / migration blockers"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jeremy Barnes" }]
dependencies = [
    "boto3>=1.28.0",
    "botocore>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pylint>=3.0.0",
]

[project.scripts]
aws-core-service-check = "check_services:main"

[tool.setuptools]
py-modules = ["check_services"]

[tool.pylint.main]
fail-under = 9.0

[tool.pylint.format]
max-line-length = 100
